# Release pipeline — builds the Windows installer on GitHub's runners.
#
# WHY THIS EXISTS: the dev machine has 7 GB of RAM and a nearly-full disk —
# a local `pnpm tauri:build` (LTO + codegen-units=1) takes ~1 h when it
# doesn't OOM. GitHub runners build the same installer in ~15 min. Local
# machines should NEVER run release builds (see CLAUDE.md).
#
# Two triggers:
#   - `workflow_dispatch` (any branch) → builds and uploads the installer as
#     an artifact. Use this to test a branch build before merging.
#   - push of a `v*` tag → same build + creates a GitHub Release with the
#     bundles attached (this is what the README means by « release taguée »).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnemosys-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          # v2 ne lit pas toujours github.token implicitement (401 sinon).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          # `v0.11.0-rc.1` and friends are marked pre-release automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
