# Mnemosys CI (Session 4 — Release tooling)
#
# Three independent jobs, all triggered on push to main/master and on every
# pull request:
#
#   1. `frontend` — typecheck + lint + Vitest (Ubuntu, fast).
#   2. `backend`  — cargo fmt + clippy -D warnings + cargo test (Ubuntu).
#   3. `build`    — `pnpm tauri build` across the OS matrix, uploads bundles.
#
# The build job is the slow one (10–20 min on cold Rust cache); we fan it out
# in parallel across Linux / macOS / Windows so a green CI implies all three
# desktop bundles compile end-to-end. The frontend and backend jobs gate
# fast-feedback loops; the build job is the gate for « can we cut a release
# from this commit? ».
#
# Required secrets: none today. When the updater is armed (`pubkey` filled in
# `tauri.conf.json`), add `TAURI_SIGNING_PRIVATE_KEY` and
# `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` (see docs/SESSION_4_RELEASE.md §Updater).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.3.0 (pinned via package.json packageManager) requires
          # Node >= 22.13 — Node 20 makes pnpm crash at install.
          node-version: "22"

      - name: Setup pnpm
        # No `version:` — action-setup reads `packageManager` from
        # package.json so CI matches the pnpm that generated the lockfile.
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

  backend:
    name: Backend (fmt + clippy + cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  licenses:
    # SECURITY (P037): block copyleft (GPL/AGPL/LGPL) dependencies from
    # entering a product shipped under MIT in compiled binaries. A single
    # GPL dependency taints the whole distributed bundle. This job fails CI
    # the moment such a license appears in either the npm or the Cargo tree.
    name: Licenses (no GPL/AGPL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm licenses (license-checker)
        # `--failOn` exits non-zero if any production dependency carries a
        # banned license. Semicolon-separated SPDX ids. `--production` skips
        # devDependencies (not shipped in the bundle).
        run: |
          pnpm dlx license-checker-rseidelsohn@4 \
            --production \
            --failOn "GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-3.0;LGPL-2.1"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check Cargo licenses (cargo-deny)
        working-directory: src-tauri
        # `cargo deny check licenses` is reliable only with an explicit
        # `src-tauri/deny.toml` allow/deny list (see MISROUTÉ note — that file
        # is outside this job's perimeter). When it lands, this step enforces
        # the same no-copyleft policy on the Rust dependency tree.
        run: |
          if [ -f deny.toml ]; then
            cargo deny check licenses
          else
            echo "::warning::src-tauri/deny.toml missing — Cargo license gate skipped. Add deny.toml with a copyleft deny-list to enforce it."
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.3.0 (pinned via package.json packageManager) requires
          # Node >= 22.13 — Node 20 makes pnpm crash at install.
          node-version: "22"

      - name: Setup pnpm
        # No `version:` — action-setup reads `packageManager` from
        # package.json so CI matches the pnpm that generated the lockfile.
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnemosys-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
