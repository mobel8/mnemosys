[package]
name = "mnemosys"
version = "0.1.0"
description = "Next-gen spaced repetition (SRS) desktop app."
authors = ["Mnemosys Team"]
edition = "2021"
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mnemosys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# NOTE(A1): `tauri-plugin-sql` is intentionally NOT used. It pulls in `sqlx`
# which conflicts with `rusqlite` on the native `libsqlite3-sys` link. Agent
# A2 owns the DB layer and exposes #[tauri::command] handlers — the frontend
# never talks SQL directly. If you need it in the future, switch rusqlite to
# `bundled-full` + `libsqlite3-sys` matching sqlx's version, or drop rusqlite
# entirely in favour of sqlx (requires rewriting A2 repositories).
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite — agent A2 will use this directly through a connection pool wrapper.
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Async runtime — Tauri requires tokio for async commands
tokio = { version = "1", features = ["full"] }

# Lazy statics
once_cell = "1"

# FSRS scheduler (used by agent A3)
fsrs = "5.2"

# Logging (for diagnostics; agents may add tracing later)
log = "0.4"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
