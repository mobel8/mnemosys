[package]
name = "mnemosys"
version = "0.10.0"
description = "Next-gen spaced repetition (SRS) desktop app."
authors = ["Mnemosys Team"]
edition = "2021"
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mnemosys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# NOTE(A1): `tauri-plugin-sql` is intentionally NOT used. It pulls in `sqlx`
# which conflicts with `rusqlite` on the native `libsqlite3-sys` link. Agent
# A2 owns the DB layer and exposes #[tauri::command] handlers — the frontend
# never talks SQL directly. If you need it in the future, switch rusqlite to
# `bundled-full` + `libsqlite3-sys` matching sqlx's version, or drop rusqlite
# entirely in favour of sqlx (requires rewriting A2 repositories).
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
# Auto-updater (Session 4). SECURITY (P036): the plugin must NOT be compiled
# in nor registered until a real minisign signing keypair exists and its
# public key is committed to `tauri.conf.json::plugins.updater.pubkey`.
# Shipping it with an empty `pubkey` + a live `endpoints` URL is a
# supply-chain RCE vector (any party able to answer the update manifest can
# push an unsigned binary). It is therefore an OPTIONAL dependency gated
# behind the `updater` feature, which is OFF by default. To arm releases:
#   1. `cargo tauri signer generate` → commit the public key into
#      `tauri.conf.json::plugins.updater.pubkey`.
#   2. add `"updater:default"` to `src-tauri/capabilities/default.json`.
#   3. register the plugin behind `#[cfg(feature = "updater")]` in
#      `src-tauri/src/lib.rs` (see MISROUTÉ note).
#   4. build with `--features updater` and sign in CI with
#      `TAURI_SIGNING_PRIVATE_KEY` / `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`.
# See `docs/SESSION_4_RELEASE.md` for the full key-generation + hosting flow.
tauri-plugin-updater = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite — agent A2 will use this directly through a connection pool wrapper.
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Async runtime — Tauri requires tokio for async commands
tokio = { version = "1", features = ["full"] }

# Lazy statics
once_cell = "1"

# FSRS scheduler (used by agent A3)
fsrs = "5.2"

# Logging (for diagnostics; agents may add tracing later)
log = "0.4"

# HTTP client for Claude API (Vague A2.1).
# - rustls-tls keeps build hermetic (no system OpenSSL dependency).
# - `stream` reserved for future streaming responses; `json` for `.json()`/`.json::<T>()`.
# - `multipart` lets Whisper transcription upload audio file parts (Vague 8).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

# Base64 decoder for Whisper voice answers (Vague 8). The frontend records
# audio with MediaRecorder, base64-encodes the Blob, and ships it over IPC —
# we decode back to bytes before forwarding to the Whisper multipart upload.
base64 = "0.22"

# PDF text extraction. Pure-Rust crate, no native system bindings required.
pdf-extract = "0.10"

# Hashing — TTS cache keys (Vague A2.2). Deterministic SHA-256 over
# `text + voice + speed` so repeated synth requests are a free disk hit.
sha2 = "0.10"

# ZIP archive parser (Vague A2.3 — Anki .apkg importer). `.apkg` files are
# plain ZIP archives bundling `collection.anki2` (SQLite) + media. Default
# features disabled to drop the heavy crypto/lzma/zstd transitive deps —
# Anki only uses DEFLATE-compressed entries.
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# SECURITY (P036): opt-in auto-updater. OFF by default so no release can ship
# the updater with an empty signing `pubkey`. Enable ONLY once a real minisign
# pubkey is committed in `tauri.conf.json` and the plugin is registered behind
# `#[cfg(feature = "updater")]` in `src-tauri/src/lib.rs`.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
